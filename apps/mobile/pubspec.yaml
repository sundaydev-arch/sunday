name: sunday_mobile
description: Nathan Zhao portfolio — Flutter (iOS / Android), content parity with @sunday/web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0
  google_fonts: ^8.2.1
  dio: ^5.11.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  sentry_flutter: ^9.26.0
  posthog_flutter: ^5.35.1
  cloudflare_turnstile: ^3.3.1
  webview_flutter: ^4.14.1
  get_it: ^9.2.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/messages/
