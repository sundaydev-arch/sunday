name: Desktop CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/desktop/**"
      - "packages/analytics/**"
      - "packages/content/**"
      - "packages/contact/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "scripts/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/desktop/**"
      - "packages/analytics/**"
      - "packages/content/**"
      - "packages/contact/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "scripts/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_API_BASE_URL: https://sundaydev.vercel.app

jobs:
  quality:
    name: Typecheck · Test · Clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @sunday/desktop typecheck
      - run: pnpm --filter @sunday/desktop test
      - run: pnpm --filter @sunday/desktop build

      - name: Rust fmt + clippy
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

  build-macos:
    name: Build macOS (debug)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Tauri build (debug, unsigned)
        working-directory: apps/desktop
        run: pnpm tauri build --debug --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          CI: true

  build-windows:
    name: Build Windows (debug)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Tauri build (debug)
        working-directory: apps/desktop
        shell: bash
        run: pnpm tauri build --debug --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          CI: true
