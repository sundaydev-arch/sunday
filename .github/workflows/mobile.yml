name: Mobile CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/mobile/**"
      - "packages/content/**"
      - "packages/contact/**"
      - "scripts/sync-mobile-*.mjs"
      - ".github/workflows/mobile.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/mobile/**"
      - "packages/content/**"
      - "packages/contact/**"
      - "scripts/sync-mobile-*.mjs"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyze · Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Messages in sync with @sunday/content
        working-directory: ${{ github.workspace }}
        run: node scripts/sync-mobile-messages.mjs --check
      - name: Contact mirror in sync with @sunday/contact
        working-directory: ${{ github.workspace }}
        run: node scripts/sync-mobile-contact.mjs --check
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  build-android:
    name: Build APK
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart --dart-define=API_BASE_URL=https://sundaydev.vercel.app

  build-ios:
    name: Build iOS (no codesign)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug -t lib/main_dev.dart
