name: Mobile Cut Release

# One-click: bump → commit → tag → trigger Mobile Release.
# Actions → Mobile Cut Release → patch / minor / major → Run workflow

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for sunday_mobile (pubspec.yaml)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: mobile-cut-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cut:
    name: Bump · Commit · Tag · Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version files
        id: bump
        run: |
          VERSION=$(node scripts/bump-mobile-version.mjs "${{ inputs.bump }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/pubspec.yaml
          git commit -m "chore(mobile): release v${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Dispatch Mobile Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Mobile Release" \
            --ref "${{ steps.bump.outputs.tag }}"
