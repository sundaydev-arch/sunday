name: Desktop Release

# Tag push → build installers → draft GitHub Release.
# Prefer: Actions → Desktop Cut Release (bumps + tags + dispatches this workflow).

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semver without prefix (e.g. 0.1.3)
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VITE_API_BASE_URL: https://sundaydev.vercel.app

jobs:
  publish:
    name: Build · Upload (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS arm64
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - platform: macos-latest
            label: macOS x64
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - platform: windows-latest
            label: Windows
            rust_target: none
            tauri_args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="desktop-v${VERSION}"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#desktop-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != 'none'
        run: rustup target add ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret; skipping codesign import."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.DESKTOP_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.DESKTOP_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.DESKTOP_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.DESKTOP_POSTHOG_HOST }}
          VITE_CAL_LINK: ${{ secrets.DESKTOP_CAL_LINK }}
          VITE_SENTRY_ENVIRONMENT: production
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          version: ${{ steps.ver.outputs.version }}
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Sunday desktop v${{ steps.ver.outputs.version }}
          releaseBody: |
            Desktop installers for **Nathan Zhao** portfolio (`@sunday/desktop`).

            ## Install
            - **macOS**: download the `.dmg` / `.app` for your chip (arm64 or x64)
            - **Windows**: run the `.exe` (NSIS) or `.msi`

            Unsigned builds work for local/testing; Gatekeeper / SmartScreen may warn without signing secrets.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}
