name: Desktop Release

# Tag push → build signed installers → publish GitHub Release + latest.json
# Prefer: Actions → Desktop Cut Release (bumps + tags + dispatches this workflow).
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY (+ optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
#
# Repo setting (create/upload release):
#   Settings → Actions → General → Workflow permissions → Read and write

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semver without prefix (e.g. 0.1.3)
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VITE_API_BASE_URL: https://sundaydev.vercel.app

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required (updater signatures)."
            echo "Generate: pnpm --filter @sunday/desktop tauri signer generate -w .local/sunday-updater.key --ci"
            echo "Then: gh secret set TAURI_SIGNING_PRIVATE_KEY < .local/sunday-updater.key"
            exit 1
          fi

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="desktop-v${VERSION}"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#desktop-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.ver.outputs.tag }}';
            const version = '${{ steps.ver.outputs.version }}';
            const name = `Sunday desktop v${version}`;
            const body = [
              'Desktop installers for **Nathan Zhao** portfolio (`@sunday/desktop`).',
              '',
              '## Install',
              '- **macOS**: download the `.dmg` / `.app` for your chip (arm64 or x64)',
              '- **Windows**: run the `.exe` (NSIS current-user installer)',
              '',
              'In-app updates use `latest.json` on this release (signed with the Tauri updater key).',
              '',
              'Apple / Authenticode signing is optional — Gatekeeper / SmartScreen may warn without those secrets.',
            ].join('\n');

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })).data;
              core.info(`Reusing existing release ${release.id} for ${tag}`);
              if (!release.draft) {
                core.info('Release already published; uploads will refresh assets.');
              }
            } catch (err) {
              if (err.status !== 404) throw err;
              try {
                release = (await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name,
                  body,
                  draft: true,
                  prerelease: false,
                })).data;
                core.info(`Created draft release ${release.id} for ${tag}`);
              } catch (createErr) {
                core.error(
                  'Failed to create GitHub Release. Enable write access: ' +
                    'Settings → Actions → General → Workflow permissions → ' +
                    '"Read and write permissions", then re-run.',
                );
                throw createErr;
              }
            }
            core.setOutput('id', String(release.id));

  publish:
    name: Build · Upload (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS arm64
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - platform: macos-latest
            label: macOS x64
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - platform: windows-latest
            label: Windows
            rust_target: none
            tauri_args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target != 'none' && matrix.rust_target || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # secrets cannot be used in `if:` (startup_failure). Gate inside the step
      # so empty APPLE_CERTIFICATE is never exported (would break codesign).
      - name: Export macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret; building without Apple codesign."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Export updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF"
            echo "$TAURI_SIGNING_PRIVATE_KEY"
            echo "EOF"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            fi
          } >> "$GITHUB_ENV"
        shell: bash

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.DESKTOP_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.DESKTOP_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.DESKTOP_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.DESKTOP_POSTHOG_HOST }}
          VITE_CAL_LINK: ${{ secrets.DESKTOP_CAL_LINK }}
          VITE_SENTRY_ENVIRONMENT: production
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri_args }}

  finalize:
    name: Publish release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = Number('${{ needs.prepare.outputs.release_id }}');
            const tag = '${{ needs.prepare.outputs.tag }}';
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            const assets = release.data.assets.map((a) => a.name);
            if (!assets.includes('latest.json')) {
              core.setFailed(
                `latest.json missing on ${tag}. Check updater signing + tauri-action upload.`,
              );
              return;
            }
            if (release.data.draft) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                draft: false,
              });
              core.info(`Published ${tag} — updater endpoint is live.`);
            } else {
              core.info(`${tag} already published.`);
            }
