name: Web CI

# Web / shared JS only — mobile & desktop-only changes do not run this.
on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "packages/analytics/**"
      - "packages/content/**"
      - "packages/contact/**"
      - "packages/typescript-config/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "lighthouserc.cjs"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/web/**"
      - "packages/analytics/**"
      - "packages/content/**"
      - "packages/contact/**"
      - "packages/typescript-config/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "lighthouserc.cjs"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Unit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Playwright
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @sunday/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
