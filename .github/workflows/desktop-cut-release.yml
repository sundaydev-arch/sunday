name: Desktop Cut Release

# One-click: bump version → commit → tag → build draft GitHub Release.
# Actions → Desktop Cut Release → patch / minor / major → Run workflow

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for @sunday/desktop
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: desktop-cut-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut:
    name: Bump · Commit · Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version files
        id: bump
        run: |
          VERSION=$(node scripts/bump-desktop-version.mjs "${{ inputs.bump }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/package.json \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/src-tauri/Cargo.toml
          git commit -m "chore(desktop): release v${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.tag }}"

  # GITHUB_TOKEN tag pushes do not trigger on.push workflows — call release directly.
  publish:
    name: Publish
    needs: cut
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.cut.outputs.version }}
      tag: ${{ needs.cut.outputs.tag }}
    secrets: inherit
